name: Update krisNOS lock

on:
  push:
    paths:
      - .github/workflows/update-lock.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Update lock
        run: nix flake lock --update-input krisNOS

      - name: Commit lock
        shell: bash
        run: |
          if git diff --quiet -- flake.lock; then
            echo "flake.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "Update krisNOS framework lock"
          git push
